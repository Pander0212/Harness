<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-Harness</title>
<style>
:root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#d6d9de; --dim:#8a919c;
        --ok:#5fbf7a; --warn:#e0b050; --err:#e06060; --acc:#6ea8fe; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
h1 { font-size:17px; margin:0 0 8px; }
h2 { font-size:15px; margin:18px 0 8px; }
main { padding:8px 16px 40px; max-width:1500px; }
.kpis { display:flex; flex-wrap:wrap; gap:8px; }
.kpi { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:6px 10px; min-width:130px; }
.kpi b { display:block; font-size:16px; }
.kpi span { color:var(--dim); font-size:12px; }
.banner { padding:8px 12px; margin:8px 0; border-radius:4px; border:1px solid; }
.banner.err { border-color:var(--err); color:var(--err); }
.banner.warn { border-color:var(--warn); color:var(--warn); }
.banner.ok { border-color:var(--ok); color:var(--ok); padding:4px 12px; }
button { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:3px;
         padding:3px 9px; cursor:pointer; font-size:13px; }
button:hover { border-color:var(--acc); }
button.on { border-color:var(--ok); color:var(--ok); }
input, textarea, select { background:var(--bg); color:var(--fg); border:1px solid var(--line);
         border-radius:3px; padding:4px 6px; font:inherit; }
textarea { width:100%; font-family:ui-monospace, monospace; font-size:12px; }
table { border-collapse:collapse; width:100%; }
th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
th { color:var(--dim); font-weight:normal; font-size:12px; }
td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.st { font-weight:600; white-space:nowrap; }
.st-läuft { color:var(--acc); } .st-fertig { color:var(--ok); } .st-fehler { color:var(--err); }
.st-schwach, .st-überlastet, .st-erstellt { color:var(--warn); } .st-retry { color:var(--warn); } .st-wartet, .st-gestoppt { color:var(--dim); }
.small { color:var(--dim); font-size:12px; }
.badge { display:inline-block; border:1px solid var(--acc); color:var(--acc); border-radius:3px;
         padding:0 5px; font-size:11px; margin-left:4px; }
tr.sub td { background:#181b20; font-size:12px; border-bottom:1px dashed var(--line); }
tr.sub td:first-child { padding-left:22px; }
.err { color:var(--err); }
pre.log { background:#0f1114; border:1px solid var(--line); padding:6px; margin:6px 0 0;
          max-height:340px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-word; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
.box { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin:8px 0; }
.grid { display:grid; grid-template-columns: 200px 1fr; gap:6px 10px; align-items:center; max-width:800px; }
.btns button { margin:1px; }
details summary { cursor:pointer; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Agent-Harness</h1>
  <div class="kpis" id="kpis"></div>
  <div class="row">
    <button id="btnEndless" onclick="toggleEndless()">Endlosmodus</button>
    <button id="btnPause" onclick="togglePause()">Pause</button>
    <span class="small" id="updated"></span>
  </div>
  <div id="banners"></div>
</header>
<main>
  <h2>Aufgaben</h2>
  <table>
    <thead><tr><th>Aufgabe</th><th>Status</th><th class="num">Kontext</th><th class="num">Calls</th>
      <th class="num">Tools</th><th class="num">Retries</th><th class="num">Kompr.</th><th class="num">Tokens (in / cached / out)</th>
      <th class="num">$</th><th class="num">Laufzeit</th><th>Aktionen</th></tr></thead>
    <tbody id="tasks"></tbody>
  </table>

  <h2>Aufgabe hinzufügen</h2>
  <div class="box">
    <div class="row"><input id="newTitle" placeholder="Titel" style="flex:1">
      <select id="newMode"><option value="single">Einzelagent</option>
        <option value="swarm">Schwarm (Koordinator + Subagenten)</option></select>
      <label><input type="checkbox" id="newFront"> vorne einreihen</label></div>
    <textarea id="newPrompt" rows="8" placeholder="Ausführliche Aufgabenbeschreibung (Markdown)…"></textarea>
    <div class="row"><button onclick="addTask()">Hinzufügen</button></div>
  </div>

  <h2>Einstellungen</h2>
  <div class="box">
    <div class="grid">
      <label>API-Key</label><input id="s_api_key" type="password" placeholder="unverändert lassen">
      <label>Base-URL</label><input id="s_base_url">
      <label>Modell</label><input id="s_model">
      <label>Max. parallele Agenten (1–20)</label><input id="s_max_parallel" type="number" min="1" max="20">
      <label>Max. Retries pro Anfrage</label><input id="s_max_retries" type="number" min="0" max="100">
      <label>Wartezeit vor Retry (s, z. B. "5" oder "5,5,10,30")</label><input id="s_retry_delays">
      <label>Bei Überlastung endlos weiter versuchen</label><input id="s_retry_overloaded_forever" type="checkbox">
      <label>Wartezeit bei Überlastung (s)</label><input id="s_overload_delay" type="number" min="1" max="300">
      <label>Vor dem Start SPEC.md + TESTPLAN.md erzeugen</label><input id="s_spec_docs" type="checkbox">
      <label>Zielumfang je Dokument (Tokens)</label><input id="s_spec_doc_tokens" type="number" min="2000" max="30000" step="1000">
      <label>MAX_HOURS pro Aufgabe</label><input id="s_max_hours" type="number" min="0.1" step="0.5">
      <label>allowed_dirs (eine Zeile pro Ordner)</label><textarea id="s_allowed_dirs" rows="3"></textarea>
      <label>finish nur bei grünen Tests</label><input id="s_verify_on_finish" type="checkbox">
      <label>Fertige Workspaces archivieren</label><input id="s_archive_finished" type="checkbox">
      <label>Subagenten / Schwarm erlauben</label><input id="s_subagents_enabled" type="checkbox">
      <label>Max. Pakete pro Schwarm</label><input id="s_max_subagents" type="number" min="1" max="20">
      <label>Max. Subagenten gesamt gleichzeitig</label><input id="s_max_total_subagents" type="number" min="1" max="20">
      <label>Anteil generierter Aufgaben als Schwarm (0–1)</label><input id="s_swarm_ratio" type="number" min="0" max="1" step="0.05">
    </div>
    <div class="row"><button onclick="saveSettings()">Speichern</button>
      <button onclick="fillSettings(true)">Neu laden</button><span id="saveMsg" class="small"></span></div>
  </div>

  <h2>Ereignisse</h2>
  <pre class="log" id="events"></pre>
</main>
<script>
let S = null, openLogs = new Set(), settingsFilled = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmtN = n => (n||0) >= 1e9 ? (n/1e9).toFixed(2)+" G" : (n||0) >= 1e6 ? (n/1e6).toFixed(2)+" M" : (n||0) >= 1e3 ? (n/1e3).toFixed(1)+" k" : String(Math.round(n||0));
const fmtUsd = n => "$" + (n||0).toFixed(n >= 100 ? 2 : 4);
function fmtDur(s) { s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}h ${m}m` : `${m}m ${s%60}s`; }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method:"POST",
     headers:{"Content-Type":"application/json","X-Harness":"1"}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert("Fehler: " + (j.error || r.status));
  return j;
}
async function act(a, id, extra) {
  if ((a === "delete" || a === "restart") && !confirm(a === "delete" ? "Aufgabe löschen?" : "Workspace verwerfen und neu starten?")) return;
  await api("/api/task/" + a, Object.assign({id}, extra || {})); refresh();
}
async function toggleEndless() { await api("/api/endless", {on: !S.endless_mode}); refresh(); }
async function togglePause() { await api("/api/pause", {on: !S.paused}); refresh(); }
async function resetThrottle() { await api("/api/throttle_reset", {}); refresh(); }
const fmtReq = r => r ? `<div class="small">⇄ ${esc(r.label)} · ${r.seconds}s · ~${fmtN(r.tokens)} Tok.</div>` : "";
async function clearAuth() { await api("/api/clear_auth", {}); refresh(); }
async function addTask() {
  const prompt = $("newPrompt").value.trim(); if (!prompt) return alert("Text fehlt");
  await api("/api/task/add", {title: $("newTitle").value, prompt, front: $("newFront").checked,
    mode: $("newMode").value});
  $("newPrompt").value = ""; $("newTitle").value = ""; refresh();
}
function fillSettings(force) {
  if (!S || (settingsFilled && !force)) return;
  const c = S.config;
  $("s_api_key").value = ""; $("s_api_key").placeholder = c.api_key ? c.api_key + " (unverändert lassen)" : "nicht gesetzt";
  $("s_base_url").value = c.base_url; $("s_model").value = c.model;
  $("s_max_parallel").value = c.max_parallel;
  $("s_retry_overloaded_forever").checked = !!c.retry_overloaded_forever; $("s_overload_delay").value = c.overload_delay;
  $("s_spec_docs").checked = !!c.spec_docs; $("s_spec_doc_tokens").value = c.spec_doc_tokens;
  $("s_max_retries").value = c.max_retries; $("s_retry_delays").value = (c.retry_delays || []).join(", "); $("s_max_hours").value = c.max_hours;
  $("s_allowed_dirs").value = (c.allowed_dirs || []).join("\n");
  $("s_verify_on_finish").checked = !!c.verify_on_finish; $("s_archive_finished").checked = !!c.archive_finished;
  $("s_subagents_enabled").checked = !!c.subagents_enabled; $("s_max_subagents").value = c.max_subagents;
  $("s_max_total_subagents").value = c.max_total_subagents; $("s_swarm_ratio").value = c.swarm_ratio;
  settingsFilled = true;
}
async function saveSettings() {
  const d = {base_url: $("s_base_url").value.trim(), model: $("s_model").value.trim(),
    max_parallel: parseInt($("s_max_parallel").value || "4"),
    max_retries: parseInt($("s_max_retries").value || "10"),
    retry_overloaded_forever: $("s_retry_overloaded_forever").checked,
    overload_delay: parseFloat($("s_overload_delay").value || "5"),
    spec_docs: $("s_spec_docs").checked, spec_doc_tokens: parseInt($("s_spec_doc_tokens").value || "12000"), retry_delays: $("s_retry_delays").value, max_hours: parseFloat($("s_max_hours").value || "36"),
    allowed_dirs: $("s_allowed_dirs").value, verify_on_finish: $("s_verify_on_finish").checked,
    archive_finished: $("s_archive_finished").checked, subagents_enabled: $("s_subagents_enabled").checked,
    max_subagents: parseInt($("s_max_subagents").value || "4"),
    max_total_subagents: parseInt($("s_max_total_subagents").value || "8"),
    swarm_ratio: parseFloat($("s_swarm_ratio").value || "0")};
  if ($("s_api_key").value.trim()) d.api_key = $("s_api_key").value.trim();
  const r = await api("/api/settings", d);
  $("saveMsg").textContent = r.ok ? "Gespeichert: " + (r.changed.join(", ") || "keine Änderung") : "";
  await refresh(); fillSettings(true);
}
function toggleLog(id) { openLogs.has(id) ? openLogs.delete(id) : openLogs.add(id); render(); }
async function showPrompt(id) {
  const j = await api("/api/task/" + encodeURIComponent(id));
  const w = window.open("", "_blank"); if (w) { w.document.title = id;
    w.document.body.innerHTML = "<pre style='white-space:pre-wrap;font:13px monospace'>" + esc(j.prompt) + "</pre>"; }
}

function sandboxHidden() { try { return localStorage.getItem("hideSandboxWarn") === "1"; } catch (e) { return false; } }
function hideSandbox() { try { localStorage.setItem("hideSandboxWarn", "1"); } catch (e) {} render(); }
function statusClass(s) { return "st st-" + (s.startsWith("retry") ? "retry" : s.split(" ")[0]); }

function render() {
  if (!S) return;
  const t = S.totals;
  $("kpis").innerHTML = [
    ["Tokens gesamt", fmtN(t.prompt_tokens + t.completion_tokens)],
    ["Input / cached", fmtN(t.prompt_tokens) + " / " + fmtN(t.cached_tokens)],
    ["Output", fmtN(t.completion_tokens)],
    ["Verdienst gesamt", fmtUsd(t.cost_usd)],
    ["$ / Stunde (Ø 1 h)", fmtUsd(S.rate_per_hour)],
    ["Hochrechnung 24 h", fmtUsd(S.projection_24h)],
    ["Parallelität", `${S.running} laufen · Limit ${S.effective_parallel}/${S.max_parallel}`],
    ["Subagenten aktiv", String(S.tasks.reduce((n, x) => n + (x.subagents_live || []).length, 0)) + " / " + S.config.max_total_subagents],
    ["Queue", S.queue_len + (S.generating ? " (generiere…)" : "")],
    ["API-Calls / Tool-Calls", fmtN(t.calls) + " / " + fmtN(t.tool_calls)],
    ["Überlastung: Wiederholungen", fmtN(t.overload_waits || 0)],
  ].map(([k, v]) => `<div class="kpi"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
  $("btnEndless").textContent = "Endlosmodus: " + (S.endless_mode ? "an" : "aus");
  $("btnEndless").className = S.endless_mode ? "on" : "";
  $("btnPause").textContent = S.paused ? "Fortsetzen (pausiert)" : "Pause (keine neuen Starts)";
  $("updated").textContent = "Aktualisiert " + new Date().toLocaleTimeString() + " · Laufzeit " + fmtDur(S.uptime);
  let b = "";
  if (S.auth_error) b += `<div class="banner err"><b>Authentifizierungsfehler – es werden keine Aufgaben gestartet.</b> Bitte API-Key/Modell prüfen und speichern.<br>${esc(S.auth_error)} <button onclick="clearAuth()">Sperre aufheben</button></div>`;
  if (S.config_problem) b += `<div class="banner err">${esc(S.config_problem)} – bitte unten in den Einstellungen eintragen.</div>`;
  if (S.sandbox_ok) b += `<div class="banner ok">Sandbox aktiv: ${esc(S.sandbox_msg)}</div>`;
  else if (!S.config_problem && !sandboxHidden()) b += `<div class="banner warn"><b>Achtung:</b> bash-Befehle der Agenten laufen NICHT abgeschottet (${esc(S.sandbox_msg)}). <button onclick="hideSandbox()">Ausblenden</button></div>`;
  if (S.shell_msg) b += `<div class="banner err">${esc(S.shell_msg)}</div>`;
  if (S.throttle_note || S.effective_parallel < S.max_parallel) b += `<div class="banner warn">${esc(S.throttle_note || "Parallelität gedrosselt")} (aktuell ${S.effective_parallel} von ${S.max_parallel}) <button onclick="resetThrottle()">Drosselung zurücksetzen</button></div>`;
  if (S.gen_error) b += `<div class="banner warn">Generator: ${esc(S.gen_error)}</div>`;
  $("banners").innerHTML = b;

  $("tasks").innerHTML = S.tasks.map(x => {
    const s = x.stats || {}; const id = esc(x.id); const q = x.queue_pos;
    const canResume = !x.running && !q;
    const btn = (a, l) => `<button onclick="act('${a}','${id}')">${l}</button>`;
    let actions = "";
    if (x.running) actions += btn("stop", "Stop");
    else actions += btn("start", "Start");
    if (canResume) actions += btn("resume", "Fortsetzen");
    actions += btn("restart", "Neustart");
    if (q) actions += `<button onclick="act('move','${id}',{dir:'up'})">▲</button><button onclick="act('move','${id}',{dir:'down'})">▼</button><button onclick="act('move','${id}',{dir:'top'})">⤒</button>`;
    if (!x.running) actions += btn("delete", "Löschen") +
      `<button onclick="act('mode','${id}',{mode:'${x.mode === "swarm" ? "single" : "swarm"}'})">${x.mode === "swarm" ? "→ Einzel" : "→ Schwarm"}</button>`;
    actions += `<button onclick="toggleLog('${id}')">Log</button><button onclick="showPrompt('${id}')">Text</button>`;
    let status = x.status + (q ? ` (#${q})` : "");
    if (x.weak && x.status !== "schwach") status += " · schwach";
    const badge = x.mode === "swarm" ? `<span class="badge">Schwarm</span>` : "";
    const subInfo = s.subagents ? ` · ${s.subagents} Subagenten` : "";
    const row = `<tr><td><b>${esc(x.title)}</b>${badge}<div class="small">${esc(x.topic)} · ${esc(x.source)}${subInfo}${x.note ? " · " + esc(x.note) : ""}</div>
      ${x.last_error ? `<div class="small err">${esc(x.last_error)}</div>` : ""}</td>
      <td class="${statusClass(x.status)}">${esc(status)}${fmtReq(x.request)}</td>
      <td class="num">${x.running ? fmtN(s.context_tokens) : "–"}</td>
      <td class="num">${s.calls||0}</td><td class="num">${s.tool_calls||0}</td><td class="num">${s.retries||0}</td>
      <td class="num">${s.compressions||0}</td>
      <td class="num">${fmtN(s.prompt_tokens)} / ${fmtN(s.cached_tokens)} / ${fmtN(s.completion_tokens)}</td>
      <td class="num">${fmtUsd(s.cost_usd)}</td><td class="num">${fmtDur(s.active_seconds)}</td>
      <td class="btns">${actions}</td></tr>`;
    const log = openLogs.has(x.id) ? `<tr><td colspan="11"><pre class="log">${esc((x.logs||[]).join("\n") || "(kein Log)")}</pre></td></tr>` : "";
    const subs = (x.subagents_live || []).map(c => `<tr class="sub"><td>↳ <b>${esc(c.name)}</b>
      <div class="small">scope: ${esc((c.scope || []).join(", ") || "Workspace")}</div>
      <div class="small">${esc(c.last)}</div></td><td class="${statusClass(c.status)}">${esc(c.status)}${fmtReq(c.request)}</td>
      <td class="num">${fmtN(c.context_tokens)}</td><td class="num">${c.calls}</td><td class="num">${c.tool_calls}</td>
      <td colspan="3"></td><td class="num">${fmtUsd(c.cost_usd)}</td><td colspan="2"></td></tr>`).join("");
    return row + subs + log;
  }).join("") || `<tr><td colspan="11" class="small">Keine Aufgaben.</td></tr>`;
  $("events").textContent = (S.events || []).slice().reverse().join("\n");
}

async function refresh() {
  try { const r = await fetch("/api/state"); if (r.ok) { S = await r.json(); render(); fillSettings(false); } }
  catch (e) { $("updated").textContent = "Verbindung verloren: " + e; }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
